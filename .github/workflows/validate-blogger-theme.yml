name: Validate Blogger theme
on:
  push:
    paths:
      - 'blogger-themes/**'
      - '.github/workflows/validate-blogger-theme.yml'
  pull_request:
    paths:
      - 'blogger-themes/**'
      - '.github/workflows/validate-blogger-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xml-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Nationalist Academy Blogger XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          theme = Path("blogger-themes/theme.xml")
          root = ET.parse(theme).getroot()
          assert root.tag.endswith("html"), f"Unexpected root element: {root.tag}"
          ns = {"b": "http://www.google.com/2005/gml/b"}
          assert root.find(".//b:skin", ns) is not None, "Missing Blogger b:skin"
          assert root.find(".//b:section[@id='main']", ns) is not None, "Missing main Blog section"
          text = theme.read_text(encoding="utf-8").lower()
          assert "taleemwaly" not in text, "Separate TaleemWaly site must not be linked"
          assert "lantro" not in text, "Premium Lantro theme branding/code must not remain"
          print(f"Valid XML and project-scope checks passed: {theme}")
          PY
